name: Build KernelSU SS Monitor module

on:
  push:
    branches:
      - feature/ksu-fs-mon-replacement
  pull_request:
    branches:
      - master
    paths:
      - "kernelsu-module/**"
      - ".github/workflows/build-ksu-module.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-ss-mon-module-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build SS monitor module and KernelSU ZIP
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      FINAL_KERNEL_ZIP: CI-ss-mon-build.zip
      ADD_TIMESTAMP_TO_ZIP: "0"
      CI: "true"
      CCACHE_DIR: /home/runner/.cache/ccache
      CCACHE_MAXSIZE: 5G

    steps:
      - name: Checkout module source
        uses: actions/checkout@v6
        with:
          path: module-src

      - name: Checkout matching SM8550 kernel source
        uses: actions/checkout@v6
        with:
          repository: Aperre/Samsung_kernel_sm8550-common-SUSFS
          # This branch contains the KDP_NS/SUSFS patch fix needed by build.sh.
          ref: fix/anykernel3-susfs-kdp-ns
          path: kernel
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            cpio \
            curl \
            dwarves \
            flex \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            gcc-arm-linux-gnueabihf \
            git \
            kmod \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            lld \
            llvm \
            openssl \
            patch \
            perl \
            python3 \
            unzip \
            wget \
            xz-utils \
            zip \
            zstd

      - name: Cache Android clang
        uses: actions/cache@v5
        with:
          path: ~/Git/Clang/clang-r547379
          key: android-clang-r547379-linux-x86

      - name: Add swap
        run: |
          sudo fallocate -l 16G /tmp/swapbuild || \
            sudo dd if=/dev/zero of=/tmp/swapbuild bs=1G count=16 status=progress
          sudo chmod 600 /tmp/swapbuild
          sudo mkswap /tmp/swapbuild
          sudo swapon /tmp/swapbuild
          free -h

      - name: Stage source as an in-tree gadget function
        run: |
          set -euo pipefail
          KERNEL_DIR="$GITHUB_WORKSPACE/kernel"
          FUNCTION_DIR="$KERNEL_DIR/drivers/usb/gadget/function"

          test -f "$FUNCTION_DIR/Makefile"
          test -f "$FUNCTION_DIR/../configfs.h"

          install -m 0644 \
            "$GITHUB_WORKSPACE/module-src/kernelsu-module/driver/f_ss_mon_gadget.c" \
            "$FUNCTION_DIR/f_ss_mon_gadget.c"

          # Force this single source file to build as a loadable module for CI.
          # The Kconfig changes remain local to the runner; no kernel source is changed in the PR.
          if ! grep -q '^obj-m += usb_f_ss_mon_gadget.o$' "$FUNCTION_DIR/Makefile"; then
            cat >> "$FUNCTION_DIR/Makefile" <<'EOF'

# CI-only entry for building the KernelSU replacement-module artifact.
usb_f_ss_mon_gadget-y := f_ss_mon_gadget.o
obj-m += usb_f_ss_mon_gadget.o
EOF
          fi

      - name: Build kernel metadata and replacement module
        working-directory: kernel
        run: |
          set -o pipefail
          chmod +x ./build.sh
          ./build.sh 2>&1 | tee "$GITHUB_WORKSPACE/build-kernel.log"

          test -s out/.config
          test -s out/Module.symvers || {
            echo "::error::The kernel build did not produce out/Module.symvers; refusing to build an incompatible module." >&2
            exit 1
          }

          make O=out \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            LLVM=1 \
            LLVM_IAS=1 \
            -j"$(nproc)" \
            M="$GITHUB_WORKSPACE/kernel/drivers/usb/gadget/function" \
            modules

          KO="$(find out -type f -name usb_f_ss_mon_gadget.ko -print -quit)"
          test -n "$KO" && test -s "$KO" || {
            echo "::error::Kbuild finished without usb_f_ss_mon_gadget.ko." >&2
            exit 1
          }
          mkdir -p "$GITHUB_WORKSPACE/dist"
          install -m 0644 "$KO" "$GITHUB_WORKSPACE/dist/usb_f_ss_mon_gadget.ko"
          modinfo "$GITHUB_WORKSPACE/dist/usb_f_ss_mon_gadget.ko"
          echo "KERNEL_RELEASE=$(make O=out ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 -s kernelrelease)" \
            >> "$GITHUB_ENV"

      - name: Package KernelSU module
        working-directory: module-src
        run: |
          set -euo pipefail
          bash kernelsu-module/package-ss-mon-ksu-zip.sh \
            "$GITHUB_WORKSPACE/dist/usb_f_ss_mon_gadget.ko" \
            "$GITHUB_WORKSPACE/dist/samsung-ss-mon-hid-fix-ksu.zip"
          sha256sum "$GITHUB_WORKSPACE/dist/"*

          {
            echo "## KernelSU SS Monitor module"
            echo
            echo "- Kernel release used for build: `$KERNEL_RELEASE`"
            echo "- KernelSU ZIP: `samsung-ss-mon-hid-fix-ksu.zip`"
            echo "- Standalone driver: `usb_f_ss_mon_gadget.ko`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload KernelSU ZIP and driver
        uses: actions/upload-artifact@v7
        with:
          name: samsung-ss-mon-hid-fix-${{ github.sha }}
          path: |
            dist/samsung-ss-mon-hid-fix-ksu.zip
            dist/usb_f_ss_mon_gadget.ko
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ss-mon-build-log-${{ github.sha }}
          path: build-kernel.log
          if-no-files-found: ignore
          retention-days: 7
