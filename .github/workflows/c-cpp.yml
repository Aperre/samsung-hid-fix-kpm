name: C/C++ CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch: 

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Install aarch64 cross compiler
      run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
    - name: Build with aarch64 cross compiler
      run: make TARGET_COMPILE=aarch64-linux-gnu-
    - name: Upload KPM zip
      uses: actions/upload-artifact@v7
      with:
        name: sshf-kpm-${{ github.sha }}
        path: build/*.kpm
        if-no-files-found: error
